name: Test macOS (Power testing lab)

on:
  workflow_dispatch:
  
  # schedule:
  #   - cron: '*/5 * * * *'
    
permissions:
  contents: read

jobs:
  test-macOS:
    runs-on: [self-hosted, ase]
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
      - name: Environment Information
        run: system_profiler SPSoftwareDataType SPHardwareDataType && sysctl -a | grep machdep.cpu
      - name: Benchmark
        id: benchmark
        run: sh benchmark.sh
